<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#202020">
<title>Зеніт-Авто.облік — сканер</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="../shared/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=PT+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/ui.css">
<style>
html,body{height:100%;overflow:hidden}
#app{height:100%}
.wrap{height:100%;display:flex}
.cam{flex:1;position:relative;background:#202020;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;overflow:hidden}
.cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;transform:scaleX(-1)}
.cam video.back{transform:none}
.vf{position:relative;width:min(380px,60vmin);aspect-ratio:1}
.vf i{position:absolute;width:20%;height:20%;border:6px solid var(--or)}
.vf .a{left:0;top:0;border-right:0;border-bottom:0;border-top-left-radius:18px}
.vf .b{right:0;top:0;border-left:0;border-bottom:0;border-top-right-radius:18px}
.vf .c{left:0;bottom:0;border-right:0;border-top:0;border-bottom-left-radius:18px}
.vf .d{right:0;bottom:0;border-left:0;border-top:0;border-bottom-right-radius:18px}
.laser{position:absolute;left:8%;right:8%;top:10%;height:3px;background:var(--or);border-radius:2px;animation:scan 2.4s ease-in-out infinite alternate}
@keyframes scan{to{top:88%}}
.cam .tx{position:relative;text-align:center;padding:0 20px}.cam .tx b{display:block;font-size:clamp(22px,3vw,30px)}.cam .tx span{font-size:clamp(15px,1.6vw,18px);color:#D0D0D0}
.camerr{position:relative;max-width:440px;background:rgba(0,0,0,.6);border-radius:12px;padding:12px 16px;font-size:15px;text-align:center}
.pane{width:min(440px,42vw);background:var(--card);display:flex;flex-direction:column;padding:20px 24px calc(16px + env(safe-area-inset-bottom));overflow:auto}
.pane .brand img{height:34px}.pane .wm{font-size:19px}
.clock{font-size:clamp(44px,5.4vw,68px);font-weight:800;letter-spacing:-.03em;line-height:1;margin-top:14px;font-variant-numeric:tabular-nums}
.auto{width:100%;min-height:68px;border-radius:14px;border:1px solid var(--bd);background:var(--card);text-align:left;padding:8px 18px;display:flex;flex-direction:column;justify-content:center;font-size:20px;font-weight:800}
.auto small{font-size:14px;font-weight:500;color:var(--mu)}
.auto.sel,.evs button.sel{border:3px solid var(--or);background:var(--or-soft)}
.evs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.evs button{min-height:56px;border-radius:12px;border:1px solid var(--bd);background:var(--card);font-size:17px;font-weight:700;padding:4px}
.stat{margin-top:auto;display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-top:14px;border-top:1px solid var(--bd);font-size:14px;color:var(--mu)}
.stat .seg button{height:36px;min-width:46px;font-size:13px}.gear{margin-left:auto;width:44px;height:44px;border-radius:10px;border:1px solid var(--bd);background:var(--card);display:flex;align-items:center;justify-content:center}
#usb{position:absolute;left:-9999px;opacity:0}
.demo{margin-top:12px;border:1px dashed var(--or);border-radius:12px;padding:10px;font-size:13px}.demo[open]{display:flex;flex-direction:column;gap:8px}.demo summary{cursor:pointer}
.demo .row{display:flex;flex-wrap:wrap;gap:6px}
.res{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;padding:calc(28px + env(safe-area-inset-top)) clamp(20px,4vw,56px) calc(24px + env(safe-area-inset-bottom))}
.res .tp{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;font-size:18px;flex-wrap:wrap}
@media (max-width:520px){.res .tp{font-size:14px}.res .tb .wm{font-size:15px}.res .tb img{height:26px}}
.res .tb{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:6px 14px 6px 8px}
.res .tb img{height:34px}.res .tb .wm{font-size:18px;color:#1B1B1B}
.res .mid{flex:1;display:flex;align-items:center;gap:clamp(24px,4vw,56px)}
.circ{flex:none;width:clamp(140px,18vw,240px);aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center}
.circ svg{width:58%;height:58%}
.res .e1{font-size:clamp(18px,2.2vw,26px);font-weight:700}
.res .who{font-size:clamp(40px,6vw,76px);font-weight:800;line-height:1.02;letter-spacing:-.03em;margin-top:8px}
.res .t3{font-size:clamp(17px,2vw,24px);margin-top:10px}
.res .ft{display:flex;justify-content:space-between;gap:12px;font-size:17px}
.chip2{display:inline-flex;margin-top:24px;background:rgba(255,255,255,.18);border-radius:999px;padding:10px 18px;font-size:clamp(16px,1.8vw,20px);font-weight:700}
.warnbox{margin-top:24px;background:#1B1B1B;color:#FFD9BD;border-radius:16px;padding:16px 22px;font-size:clamp(17px,2vw,22px);line-height:1.4;max-width:680px}.warnbox b{color:#fff}
.r-ok{background:#1E7B34;color:#fff}.r-ok .tp,.r-ok .e1,.r-ok .t3,.r-ok .ft{color:#D4EEDB}
.r-yl{background:#EE7023;color:#1B1B1B}.r-yl .tp,.r-yl .e1,.r-yl .t3,.r-yl .ft{color:#3D1D05}
.r-rd{background:#B3261E;color:#fff}.r-rd .tp,.r-rd .e1,.r-rd .t3,.r-rd .ft{color:#F8D2CF}
.r-bl{background:#2F5BD3;color:#fff}.r-bl .tp,.r-bl .e1,.r-bl .t3,.r-bl .ft{color:#DCE5FB}
.r-gr{background:#3A3A36;color:#fff}.r-gr .tp,.r-gr .e1,.r-gr .t3,.r-gr .ft{color:#D6D6D0}
.reg{height:100%;display:flex;align-items:center;justify-content:center;padding:16px;background:var(--bg)}
.reg .card{border-top:6px solid var(--or);width:min(460px,100%);padding:28px;display:flex;flex-direction:column;gap:14px}
.reg h1{margin:6px 0 0;font-size:26px}.reg p{margin:0;color:var(--mu)}
.reg-badge{align-self:flex-start;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:var(--or);color:#111318;padding:6px 12px;border-radius:6px}
.reg .reg-foot{font-size:13px;border-top:1px solid var(--bd);padding-top:12px}
.reg .code{font-size:32px;letter-spacing:.2em;text-align:center;height:64px}
@media (max-width:760px){
  html,body{overflow:auto}
  .wrap{flex-direction:column;height:auto}
  .cam{min-height:56vh}.pane{width:auto}
  .res .mid{flex-direction:column;align-items:flex-start;justify-content:center}
}
</style>
</head>
<body>
<div id="app"></div>
<script src="../shared/config.js"></script>
<script src="../shared/i18n.js"></script>
<script src="../shared/vendor/qrcode.js"></script>
<script src="../shared/vendor/jsQR.js"></script>
<script src="../shared/ui.js"></script>
<script src="../shared/api.js"></script>
<script src="app.js"></script>
</body>
</html>
