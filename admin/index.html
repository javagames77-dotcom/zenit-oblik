<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Зеніт-Авто.облік — адмінка</title>
<link rel="icon" href="../shared/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&family=PT+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/ui.css">
<style>
.hdr{position:sticky;top:0;z-index:20;background:var(--card);display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 24px;border-bottom:1px solid var(--bd)}
.hdr .sp{flex:1}
.hdr .in{width:260px}
.moon{width:40px;height:40px;border:1px solid var(--bd);border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center}
.user{font-size:15px;white-space:nowrap}.user span{color:var(--mu)}
.demo-bar{background:var(--or-soft);color:var(--or-ink);font-size:13px;padding:6px 24px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.demo-bar button{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;padding:0}
.layout{display:flex;min-height:calc(100vh - 66px)}
.side{width:280px;flex:none;border-right:1px solid var(--bd);background:var(--card);padding:20px 16px;display:flex;flex-direction:column;gap:4px}
.si{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;font-size:16px;font-weight:500;color:var(--ink);text-decoration:none;white-space:nowrap}
.si:hover{background:var(--bg)}
.si.on{background:var(--or-soft);box-shadow:inset 4px 0 0 var(--or);font-weight:700;color:var(--or-ink)}
.si>span:first-child{overflow:hidden;text-overflow:ellipsis}.si .b{flex:none;margin-left:auto;font-size:13px;font-weight:700;border-radius:999px;padding:1px 9px}
.ver{margin-top:12px;padding:0 16px;font-size:14px;color:var(--mu)}
.main{flex:1;padding:24px clamp(16px,2.5vw,36px) 48px;display:flex;flex-direction:column;gap:20px}
.mh{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.mh h1{margin:0;font-size:30px;line-height:1.15;font-weight:800}
.mh p{margin:4px 0 0;color:var(--mu);font-size:15px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.ctl .in{width:auto}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{padding:18px}
.kpi .l{font-size:15px;color:var(--mu)}
.kpi .v{font-size:34px;font-weight:800;line-height:1.2;margin-top:6px}
.kpi .s{font-size:14px;margin-top:6px;font-weight:600}
.kpi.w{border-color:#F3C9A6}.kpi.w .v,.kpi.w .s{color:var(--wa)}
.kpi.e{border-color:#F1B7B7}.kpi.e .v,.kpi.e .s{color:var(--er)}
a.kpi{text-decoration:none;color:inherit}a.kpi:hover{border-color:var(--or)}
.bar{height:6px;background:var(--bg);border-radius:3px;margin-top:10px}.bar div{height:6px;background:var(--or);border-radius:3px;transition:width .4s}
.cols{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.feed{flex:999 1 600px;overflow:hidden}
.rcol{flex:1 1 280px;display:flex;flex-direction:column;gap:20px}
.ch{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--bd)}
.ch h2,.rc h2{margin:0;font-size:19px;font-weight:800}
.tabsl{display:flex;gap:18px;flex-wrap:wrap}
.tabsl button{border:0;background:none;padding:6px 0;font-size:15px;font-weight:600;color:var(--mu);border-bottom:3px solid transparent}
.tabsl button.on{color:var(--ink);border-bottom-color:var(--or)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:13px;color:var(--mu);font-weight:600;padding:10px 8px;white-space:nowrap}
td{padding:11px 8px;border-top:1px solid var(--bd);vertical-align:top}
th:first-child,td:first-child{padding-left:20px}th:last-child,td:last-child{padding-right:20px}
td.t{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
td small{display:block;color:var(--mu);font-size:13px}
td .acts{display:flex;gap:6px;flex-wrap:nowrap}
tr.new td{animation:flash 2s ease-out}
@keyframes flash{from{background:var(--or-soft)}to{background:transparent}}
.empty{padding:28px 20px;color:var(--mu);text-align:center}
.rc{padding:18px 20px}
.rc p{margin:4px 0 8px;font-size:14px;color:var(--mu)}
.wl{display:flex;align-items:center;gap:12px;margin-top:12px}
.av{width:38px;height:38px;border-radius:50%;background:var(--or-soft);color:var(--or-ink);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;flex:none}
.wl{align-items:flex-start}.wl .n{flex:1;font-weight:700;font-size:15px;line-height:1.3}.wl .n small{display:block;font-weight:400;color:var(--mu);font-size:13px;margin:2px 0 6px}
.st{display:flex;gap:10px;margin:12px 0}.st div{flex:1;border-radius:12px;padding:10px 12px;font-size:14px}.st b{display:block;font-size:24px}
.off{border:1px solid #F1B7B7;border-radius:12px;padding:12px;font-size:15px;margin-top:8px}.off small{display:block;color:var(--mu);font-size:13px;margin-top:2px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.bcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.bc{padding:18px 20px}
.bc h3{margin:0 0 2px;font-size:19px}
.bc p{margin:0 0 10px;color:var(--mu);font-size:14px}
.bc ul{margin:0 0 12px;padding:0;list-style:none}
.bc li{padding:8px 0;border-top:1px solid var(--bd);display:flex;justify-content:space-between;gap:8px;font-size:15px}
.code-big{font-size:44px;font-weight:800;letter-spacing:.12em;text-align:center;padding:14px;background:var(--bg);border-radius:14px;margin:10px 0}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:#f7f7f8}
/* вход в админку всегда светлый — чтобы не путать с тёмным входом PWA */
.auth-card{width:min(400px,100%);background:#fff;color:#111318;border:1px solid #e6e6ea;border-radius:18px;padding:28px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 30px rgba(17,19,24,.06);
  --ink:#111318;--mu:#6b6f78;--bd:#e2e3e7;--bg:#f7f7f8;--card:#fff;color-scheme:light}
.ac-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.auth-card .brand img{background:none;padding:0;height:34px}
.ac-badge{align-self:flex-start;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;background:#111318;color:#fff;padding:5px 10px;border-radius:6px;margin-top:6px}
.auth-card h1{margin:0;font-size:24px;line-height:1.2}
.ac-sub{margin:-6px 0 4px;color:var(--mu);font-size:14px;line-height:1.45}
.auth-card .in{background:#fff;color:#111318}
.ac-btn{height:48px;font-size:16px}
.ac-err{background:#fdecea;color:#b3261e;border-radius:10px;padding:10px 12px;font-size:14px}
.ac-demo{margin:0;font-size:13px;color:var(--mu)}
.ac-foot{margin:6px 0 0;padding-top:14px;border-top:1px solid var(--bd);font-size:13px;line-height:1.45;color:var(--mu)}
.ac-foot a{color:inherit}
@media(max-width:900px){
  .layout{flex-direction:column}
  .side{width:auto;flex-direction:row;overflow-x:auto;padding:8px 12px;border-right:0;border-bottom:1px solid var(--bd)}
  .si{font-size:15px;padding:8px 12px}.ver{display:none}
  .hdr{padding:10px 16px}.hdr .in{width:100%;order:9}
  .grid2{grid-template-columns:minmax(0,1fr)}
}
.bulk{position:sticky;top:76px;z-index:6;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:var(--ink);color:var(--card);padding:10px 16px;border-radius:14px}
.bulk .btn{background:var(--card);color:var(--ink);border-color:transparent}
.namebtn{border:0;background:none;padding:0;font:inherit;font-weight:700;text-align:left;color:var(--ink);cursor:pointer}.namebtn:hover{color:var(--or-ink);text-decoration:underline}
.lnk{color:var(--card)}
.lnk{border:0;background:none;padding:0 4px;color:var(--link);font-size:13px;font-weight:600;text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.warn{background:var(--er-bg);color:var(--er);border-radius:12px;padding:10px 14px;margin-bottom:12px;font-weight:600}
.modal.wide{width:min(820px,100%)}
.accl{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.accb{border:1px solid var(--bd);border-radius:12px;padding:8px 12px}
.accbh{font-weight:800;margin-bottom:4px}
.accg{display:flex;align-items:center;gap:10px;padding:6px 0;flex-wrap:wrap}
.accg .gn{flex:1;min-width:90px;font-size:15px}
.accg .pill{font-size:12px}
.main.is-demo{outline:2px dashed var(--or);outline-offset:-10px;border-radius:14px}
.demo-tag{display:inline-block;align-self:flex-start;width:max-content;margin-bottom:12px;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--or-ink);border:1.5px dashed var(--or);border-radius:6px;padding:4px 9px}
.si.is-demo{outline:1.5px dashed var(--or);outline-offset:-3px}
.demo-route .modal{outline:2px dashed var(--or);outline-offset:-6px}
.sched td,.sched th{padding:6px 6px;white-space:nowrap}.sched .in.sm{height:36px;padding:0 8px;min-width:0;width:100%}.sched input[type=number]{width:80px}
.sched input[type=checkbox]{width:20px;height:20px}
tr.bad td{background:color-mix(in srgb,var(--or) 6%,transparent)}
th.sortable{cursor:pointer;user-select:none}th.sortable:hover{color:var(--or-ink)}
.hl{list-style:none;padding:0;margin:0}.hl li{display:grid;grid-template-columns:110px 1fr auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--bd)}
.dtot{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:12px}.dtot div{border:1px solid var(--bd);border-radius:12px;padding:10px;display:flex;flex-direction:column}
.dtot b{font-size:22px}.dtot span{font-size:12px;font-weight:700}.dtot small{color:var(--mu);font-size:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cw{font-size:12px;font-weight:700;color:var(--mu);text-align:center}
.cd{border:1px solid var(--bd);border-radius:8px;min-height:46px;background:var(--card);color:var(--ink);font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;padding:2px}
.cd small{font-size:10px;color:var(--mu)}.cd:disabled{cursor:default;opacity:.45}
.cd.ok{background:#E3F4E6;border-color:#9AD3A8}.cd.bad{background:#FDEBDD;border-color:#F3B58A}.cd.abs{background:#FDE7E5;border-color:#F2A29B}
.cd.exc{background:#E4ECFD;border-color:#A9C0F5}.cd.off{background:var(--bg)}
:root[data-theme=dark] .cd.ok,:root[data-theme=dark] .cd.bad,:root[data-theme=dark] .cd.abs,:root[data-theme=dark] .cd.exc{color:#111318}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--mu);margin-top:8px}.legend .cd{min-height:14px;width:18px;display:inline-block;padding:0}
@media (max-width:700px){.dtot{grid-template-columns:repeat(2,1fr)}}
@media print{.demo-tag{display:none}.main.is-demo{outline:0}.hdr,.side,.demo-bar,.noprint{display:none!important}.main{padding:0}}
</style>
</head>
<body>
<div id="app"></div>
<script src="../shared/config.js"></script>
<script src="../shared/i18n.js"></script>
<script src="../shared/vendor/qrcode.js"></script>
<script src="../shared/ui.js"></script>
<script src="../shared/api.js"></script>
<script src="app.js"></script>
</body>
</html>
